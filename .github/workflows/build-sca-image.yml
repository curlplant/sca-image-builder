name: Build Log4j Vuln Image Tar (Self-Built)
on:
  push:
    branches: [ log4j-vuln ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 检出代码（获取Dockerfile）
        uses: actions/checkout@v4

      - name: 🔨 本地构建带Log4j漏洞的镜像
        run: docker build -t sca-log4j-vuln:latest .

      - name: 📦 导出镜像为tar包
        run: docker save -o sca-log4j-vuln.tar sca-log4j-vuln:latest

      - name: 📤 上传tar包作为可下载产物
        uses: actions/upload-artifact@v4
        with:
          name: sca-log4j-vuln-tar
          path: sca-log4j-vuln.tar
          retention-days: 30
