name: Build Log4j Vuln Image Tar
on:
  push:
    branches: [ log4j-vuln ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 拉取开源Log4j漏洞测试镜像
        run: docker pull christophetd/log4shell-vulnerable-app:latest
      
      - name: 📦 导出镜像为tar包
        run: docker save -o sca-log4j-vuln.tar christophetd/log4shell-vulnerable-app:latest
      
      - name: 📤 上传tar包作为可下载产物
        uses: actions/upload-artifact@v4
        with:
          name: sca-log4j-vuln-tar
          path: sca-log4j-vuln.tar
          retention-days: 30
