name: Build Log4j Vuln Image Tar
on:
  push:
    branches: [ log4j-vuln ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Log4j vulnerability test image (CVE-2021-44228)
        run: docker pull vulfocus/log4j2-rce:latest

      - name: Export image to tar
        run: docker save -o sca-log4j-vuln.tar vulfocus/log4j2-rce:latest

      - name: Upload tar package
        uses: actions/upload-artifact@v4
        with:
          name: sca-log4j-vuln-tar
          path: sca-log4j-vuln.tar
