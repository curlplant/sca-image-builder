name: Build SCA Test Image Tar
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 拉取alpine轻量镜像（稳定可用，5MB极小体积）
        run: docker pull alpine:latest
      
      - name: 📦 导出镜像为tar包
        run: docker save -o sca-light-test-image.tar alpine:latest
      
      - name: 📤 上传tar包作为可下载产物
        uses: actions/upload-artifact@v4
        with:
          name: sca-light-test-image-tar
          path: sca-light-test-image.tar
          retention-days: 30
