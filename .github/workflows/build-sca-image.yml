name: Build Log4j Vuln Image Tar (Self-Built Fixed)
on:
  push:
    branches: [ log4j-vuln ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 配置Docker国内镜像源（解决限流）
        run: |
          sudo mkdir -p /etc/docker
          echo '{
            "registry-mirrors": ["https://docker.mirrors.ustc.edu.cn", "https://hub-mirror.c.163.com"]
          }' | sudo tee /etc/docker/daemon.json
          sudo systemctl daemon-reload
          sudo systemctl restart docker

      - name: 🚀 检出代码（获取Dockerfile）
        uses: actions/checkout@v4

      - name: 🔨 本地构建带Log4j漏洞的镜像
        run: docker build -t sca-log4j-vuln:latest .

      - name: 📦 导出镜像为tar包
        run: docker save -o sca-log4j-vuln.tar sca-log4j-vuln:latest
      
      - name: 📤 上传tar包作为可下载产物
        uses: actions/upload-artifact@v4
        with:
          name: sca-log4j-vuln-tar
          path: sca-log4j-vuln.tar
          retention-days: 30
